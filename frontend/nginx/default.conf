# Cloudflare 터널을 거치면 접속자 주소가 CF-Connecting-IP 헤더로 온다. 없으면(로컬 접속) 연결한 주소를 쓴다.
map $http_cf_connecting_ip $real_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m; # 커뮤니티 사진 5MB 까지
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # API 와 업로드 사진은 백엔드로
    location ~ ^/(api|uploads)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s; # AI 응답이 느릴 수 있다
    }

    # 파일 이름에 해시가 붙은 정적 파일은 오래 캐시
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # 나머지는 React 앱 (새로고침해도 /companies/005930 같은 주소가 열리게)
    location / {
        expires -1; # 항상 새로 확인 (배포하면 바로 새 화면이 보이게)
        try_files $uri /index.html;
    }
}
